name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q poi_core.py gui.py cli.py tools

      - name: 命令行入口自检
        run: python cli.py --help

      - name: 独立脚本自检
        run: |
          python tools/baidu_poi.py --help
          python tools/select_best.py --help
          python tools/make_contact_sheet.py --help

      - name: 安装可选依赖复检
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import PIL, sys; print('Pillow', PIL.__version__, 'on', sys.version.split()[0])"

  gui-import:
    name: GUI 导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: 导入 gui 模块（不启动窗口）
        run: python -c "import gui; print('gui ok', gui.DISPLAY_NAME, gui.APP_VERSION)"
