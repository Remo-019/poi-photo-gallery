name: 探针

# 每天定时抽查一次「还能不能拿到原图」。
# 高德哪天静默忽略 limit_1，接口照常返回成功、ci 也照常绿——
# 只有这个 workflow 会变红并给你发邮件。
on:
  schedule:
    # UTC 01:00 = 北京时间 09:00。GitHub 的 cron 只认 UTC。
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 原图可用性抽查
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      # 没配 secret 时不能红——否则 fork 和首次使用的人天天收失败邮件。
      - name: 检查是否配了 AMAP_KEY
        id: key
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: |
          if [ -z "$AMAP_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::没有配置 secrets.AMAP_KEY，本次跳过。去 Settings → Secrets and variables → Actions 添加后生效。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 跑探针
        if: steps.key.outputs.skip == 'false'
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: python probe.py --json probe_history.json

      - name: 上传历史记录
        if: always() && steps.key.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: probe-history
          path: probe_history.json
          retention-days: 90
          if-no-files-found: ignore
