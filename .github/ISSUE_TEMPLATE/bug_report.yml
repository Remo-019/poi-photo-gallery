name: Bug 反馈
description: 采集失败、图片不对、程序报错等
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先跑一次 `python cli.py --help` 与 `python -m compileall -q poi_core.py gui.py cli.py`，确认不是环境问题。

  - type: dropdown
    id: entry
    attributes:
      label: 使用的入口
      options:
        - cli.py（命令行）
        - gui.py（桌面界面）
        - tools/ 下的独立脚本
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 数据源
      options:
        - 高德 + 百度
        - 高德
        - 百度
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统、Python 版本、是否打包成 exe
      placeholder: Windows 11 / Python 3.13.7 / 直接跑脚本
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 复现命令或界面参数
      description: 命令行请贴完整命令；界面请贴城市、关键词、数量上限、每个 POI 图片数。**Key 请打码**
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 报错请贴完整 traceback；图片不对请说明是缩略图、404、还是同名不同店
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 输出目录里的 manifest.csv 片段、相关截图等
    validations:
      required: false
